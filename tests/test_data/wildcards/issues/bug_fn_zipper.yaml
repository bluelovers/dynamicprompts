lazy-wildcards:
  subject:
    costume-elem-accessories:
      zipper:
        prompts:
          - >-
            {1-$$__lazy-wildcards/subject/costume-elem-accessories/zipper/style_a01__}
        style_a01:
          - __lazy-wildcards/utils/fn/made-of-inspired(v=zippers)__
        style_a02:
          - 1::__lazy-wildcards/utils/fn/made-of-inspired(v=zippers)__
        style_a03:
          - 0.9::__lazy-wildcards/utils/fn/made-of-inspired(v=zippers)__
        style_b01:
          - x__lazy-wildcards/utils/fn/made-of-inspired(v=zippers)__
  utils:
    fn:
      # __lazy-wildcards/utils/fn/style-inspired(v=lego)__
      style-inspired:
        - >-
          __lazy-wildcards/utils/fn/inspired__
          , __lazy-wildcards/utils/fn/style-of__
      style-of:
        - >-
          style of ${v}
      inspired:
        - >-
          ${v}-inspired
      art:
        - >-
          the art of ${v}
      made-of-inspired:
        - >-
          __lazy-wildcards/utils/fn/inspired__
          , made of ${v}
      made-of:
        - >-
          made of ${v}
      pattern-inspired:
        - >-
          __lazy-wildcards/utils/fn/pattern__
          , __lazy-wildcards/utils/fn/inspired__
      pattern:
        - >-
          ${v} pattern
